[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-agent-memory"
version = "0.1.0"
description = "Extract evidence-linked knowledge and experimental memories from research PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=4,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pdf-memory = "pdf_to_agent_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
